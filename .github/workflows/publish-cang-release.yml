name: Publish cang libkrun prebuilts

on:
  push:
    branches:
      - cang
    tags:
      - "v[0-9]*-cang.*"

permissions:
  contents: write

concurrency:
  # Scoped per ref so a tag-triggered permanent release never queues behind an
  # in-flight branch build (the x86_64 LTO kernel job alone is ~30 minutes).
  # Pushes to the same ref still serialize.
  group: cang-libkrun-prebuilt-releases-${{ github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_PREFIX: cang
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache

jobs:
  build:
    name: Build ${{ matrix.system }} libkrun prebuilt package
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
            host_arch: x86_64
            asset: libkrun-x86_64-linux-full.tgz
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
            host_arch: aarch64
            asset: libkrun-aarch64-linux-full.tgz

    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Set up build environment
        uses: ./.github/actions/setup-build-env

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Build libkrun full-feature package
        run: |
          set -euo pipefail
          test "$(uname -m)" = "${{ matrix.host_arch }}"

          sccache --version

          make clean
          make BLK=1 NET=1 GPU=1 INPUT=1 TIMESYNC=1
          make DESTDIR="$PWD/tmp" PREFIX=/usr install

          rm -rf pkgroot
          mkdir -p pkgroot
          cp -a tmp/usr/lib64 pkgroot/lib64
          cp -a tmp/usr/include pkgroot/include

          test -f pkgroot/include/libkrun.h
          test -f pkgroot/include/libkrun_display.h
          test -f pkgroot/include/libkrun_input.h
          test -f pkgroot/include/libkrun_init.h
          test -f pkgroot/lib64/pkgconfig/libkrun.pc
          test -f pkgroot/lib64/pkgconfig/libkrun_init.pc
          test -n "$(find pkgroot/lib64 -maxdepth 1 -name 'libkrun.so*' -print -quit)"
          # cang cannot boot without the init blob: upstream main moved the
          # guest init out of libkrun.so into libkrun_init.so.
          test -n "$(find pkgroot/lib64 -maxdepth 1 -name 'libkrun_init.so*' -print -quit)"

          tar -C pkgroot -czf "${{ matrix.asset }}" lib64 include
          tar -tzf "${{ matrix.asset }}" | grep -Fx lib64/pkgconfig/libkrun.pc
          if tar -tzf "${{ matrix.asset }}" | grep -E '(^/|^tmp/)'; then
            echo "unexpected absolute or tmp-prefixed archive member" >&2
            exit 1
          fi
          if tar -xOzf "${{ matrix.asset }}" lib64/pkgconfig/libkrun.pc | grep -F "$PWD"; then
            echo "pkg-config file contains a workspace path" >&2
            exit 1
          fi

          make clean
        shell: bash

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: libkrun-${{ matrix.system }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  publish-release:
    name: Publish cang libkrun prerelease
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: release
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::12}"

          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            # A pushed v<version>-cang.<n> tag publishes a permanent,
            # version-addressed release: the tag is the release identity and
            # already pins the commit, so no --target is needed. `cang-<sha>`
            # releases stay rolling dev artifacts that the prune job below
            # deletes; its filter only matches `cang-`, so permanent releases
            # are never pruned.
            version="${GITHUB_REF_NAME#v}"
            full_version="$(sed -n 's/^FULL_VERSION=\(.*\)$/\1/p' Makefile)"
            if [ -z "${full_version}" ]; then
              echo "failed to read FULL_VERSION from Makefile" >&2
              exit 1
            fi
            if ! printf '%s' "${version}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-cang\.[0-9]+$'; then
              echo "tag must look like v<major>.<minor>.<patch>-cang.<n>: ${GITHUB_REF_NAME}" >&2
              exit 1
            fi
            case "${version}" in
              "${full_version}-cang."*) ;;
              *)
                echo "tag ${GITHUB_REF_NAME} does not match this branch's libkrun ${full_version}" >&2
                exit 1
                ;;
            esac
            {
              echo "tag_name=${GITHUB_REF_NAME}"
              echo "release_title=libkrun ${GITHUB_REF_NAME}"
              echo "permanent=true"
            } >> "${GITHUB_OUTPUT}"
          else
            {
              echo "tag_name=${RELEASE_PREFIX}-${short_sha}"
              echo "release_title=cang libkrun ${short_sha}"
              echo "permanent=false"
            } >> "${GITHUB_OUTPUT}"
          fi
        shell: bash

      - name: Download prebuilt artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: libkrun-*
          path: dist
          merge-multiple: true

      - name: Attest prebuilt artifacts
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/*.tgz"

      - name: Create release and upload assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
          RELEASE_TITLE: ${{ steps.release.outputs.release_title }}
          PERMANENT: ${{ steps.release.outputs.permanent }}
        run: |
          set -euo pipefail

          test -f dist/libkrun-x86_64-linux-full.tgz
          test -f dist/libkrun-aarch64-linux-full.tgz

          notes="Full-feature Linux libkrun artifacts for cang commit ${GITHUB_SHA}. Built with BLK, NET, GPU, SND, and INPUT enabled."

          if [ "${PERMANENT}" = "true" ]; then
            # The pushed tag already pins the commit, so a re-run of a green or
            # half-finished release just refreshes its assets.
            if ! gh release view "${TAG_NAME}" >/dev/null 2>&1; then
              gh release create "${TAG_NAME}" \
                --title "${RELEASE_TITLE}" \
                --notes "${notes}" \
                --prerelease
            fi
          else
            if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
              gh release delete "${TAG_NAME}" --yes --cleanup-tag
            fi
            gh release create "${TAG_NAME}" \
              --target "${GITHUB_SHA}" \
              --title "${RELEASE_TITLE}" \
              --notes "${notes}" \
              --prerelease
          fi

          gh release upload "${TAG_NAME}" dist/*.tgz --clobber
        shell: bash

  prune-old-cang-releases:
    name: Keep latest 10 cang libkrun prereleases
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    needs: publish-release
    steps:
      - name: Delete older cang releases and tags
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release list --limit 100 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | map(select(.tagName | startswith("cang-"))) | .[10:][]?.tagName' |
          while IFS= read -r tag_name; do
            [ -n "${tag_name}" ] || continue
            echo "Deleting old cang libkrun release ${tag_name}"
            gh release delete "${tag_name}" --yes --cleanup-tag
          done
        shell: bash
