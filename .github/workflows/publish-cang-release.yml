name: Publish cang libkrun prebuilts

on:
  push:
    branches:
      - cang
  workflow_dispatch:
    inputs:
      version:
        description: Permanent release version ({libkrun FULL_VERSION}-cang.<n>)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: cang-libkrun-prebuilt-releases
  cancel-in-progress: false

env:
  RELEASE_PREFIX: cang
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache

jobs:
  build:
    name: Build ${{ matrix.system }} libkrun prebuilt package
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
            host_arch: x86_64
            asset: libkrun-x86_64-linux-full.tgz
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
            host_arch: aarch64
            asset: libkrun-aarch64-linux-full.tgz

    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Set up build environment
        uses: ./.github/actions/setup-build-env

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Build libkrun full-feature package
        run: |
          set -euo pipefail
          test "$(uname -m)" = "${{ matrix.host_arch }}"

          sccache --version

          make clean
          make BLK=1 NET=1 GPU=1 SND=1 INPUT=1
          make DESTDIR="$PWD/tmp" PREFIX=/usr install

          rm -rf pkgroot
          mkdir -p pkgroot
          cp -a tmp/usr/lib64 pkgroot/lib64
          cp -a tmp/usr/include pkgroot/include

          test -f pkgroot/include/libkrun.h
          test -f pkgroot/include/libkrun_display.h
          test -f pkgroot/include/libkrun_input.h
          test -f pkgroot/lib64/pkgconfig/libkrun.pc
          test -n "$(find pkgroot/lib64 -maxdepth 1 -name 'libkrun.so*' -print -quit)"

          tar -C pkgroot -czf "${{ matrix.asset }}" lib64 include
          tar -tzf "${{ matrix.asset }}" | grep -Fx lib64/pkgconfig/libkrun.pc
          if tar -tzf "${{ matrix.asset }}" | grep -E '(^/|^tmp/)'; then
            echo "unexpected absolute or tmp-prefixed archive member" >&2
            exit 1
          fi
          if tar -xOzf "${{ matrix.asset }}" lib64/pkgconfig/libkrun.pc | grep -F "$PWD"; then
            echo "pkg-config file contains a workspace path" >&2
            exit 1
          fi

          make clean
        shell: bash

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: libkrun-${{ matrix.system }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  publish-release:
    name: Publish cang libkrun prerelease
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::12}"

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            # A dispatched run publishes a permanent, version-addressed release.
            # `cang-<sha>` releases stay rolling dev artifacts that the prune
            # job below deletes; `v*-cang.*` releases are never pruned.
            full_version="$(sed -n 's/^FULL_VERSION=\(.*\)$/\1/p' Makefile)"
            if [ -z "${full_version}" ]; then
              echo "failed to read FULL_VERSION from Makefile" >&2
              exit 1
            fi
            if ! printf '%s' "${VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+-cang\.[0-9]+$'; then
              echo "version must look like <major>.<minor>.<patch>-cang.<n>: ${VERSION}" >&2
              exit 1
            fi
            case "${VERSION}" in
              "${full_version}-cang."*) ;;
              *)
                echo "version ${VERSION} does not match this branch's libkrun ${full_version}" >&2
                exit 1
                ;;
            esac
            {
              echo "tag_name=v${VERSION}"
              echo "release_title=libkrun v${VERSION}"
              echo "permanent=true"
            } >> "${GITHUB_OUTPUT}"
          else
            {
              echo "tag_name=${RELEASE_PREFIX}-${short_sha}"
              echo "release_title=cang libkrun ${short_sha}"
              echo "permanent=false"
            } >> "${GITHUB_OUTPUT}"
          fi
        shell: bash

      - name: Download prebuilt artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: libkrun-*
          path: dist
          merge-multiple: true

      - name: Attest prebuilt artifacts
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: "dist/*.tgz"

      - name: Create release and upload assets
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
          RELEASE_TITLE: ${{ steps.release.outputs.release_title }}
          PERMANENT: ${{ steps.release.outputs.permanent }}
        run: |
          set -euo pipefail

          test -f dist/libkrun-x86_64-linux-full.tgz
          test -f dist/libkrun-aarch64-linux-full.tgz

          notes="Full-feature Linux libkrun artifacts for cang commit ${GITHUB_SHA}. Built with BLK, NET, GPU, SND, and INPUT enabled."

          if [ "${PERMANENT}" = "true" ]; then
            existing_commit="$(gh api "repos/${GH_REPO}/releases/tags/${TAG_NAME}" --jq .target_commitish 2>/dev/null || true)"
            if [ -n "${existing_commit}" ] && [ "${existing_commit}" != "${GITHUB_SHA}" ]; then
              echo "release ${TAG_NAME} already exists for commit ${existing_commit}" >&2
              echo "bump the release version instead of republishing ${TAG_NAME}" >&2
              exit 1
            fi
            if [ -z "${existing_commit}" ]; then
              gh release create "${TAG_NAME}" \
                --target "${GITHUB_SHA}" \
                --title "${RELEASE_TITLE}" \
                --notes "${notes}" \
                --prerelease
            fi
          else
            if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
              gh release delete "${TAG_NAME}" --yes --cleanup-tag
            fi
            gh release create "${TAG_NAME}" \
              --target "${GITHUB_SHA}" \
              --title "${RELEASE_TITLE}" \
              --notes "${notes}" \
              --prerelease
          fi

          gh release upload "${TAG_NAME}" dist/*.tgz --clobber
        shell: bash

  prune-old-cang-releases:
    name: Keep latest 10 cang libkrun prereleases
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: publish-release
    steps:
      - name: Delete older cang releases and tags
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release list --limit 100 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | map(select(.tagName | startswith("cang-"))) | .[10:][]?.tagName' |
          while IFS= read -r tag_name; do
            [ -n "${tag_name}" ] || continue
            echo "Deleting old cang libkrun release ${tag_name}"
            gh release delete "${tag_name}" --yes --cleanup-tag
          done
        shell: bash
